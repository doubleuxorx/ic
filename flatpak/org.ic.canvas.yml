app-id: org.ic.canvas
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable
command: ic

finish-args:
  # The app is offline; deliberately do not grant --share=network.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Workspaces are directories that the Rust backend watches and edits directly,
  # and a workspace may live anywhere under $HOME, so nothing narrower keeps the
  # application usable: the file chooser portal hands out single files, not a
  # tree that `notify` can watch. Mask the directories a compromised webview
  # would want most; with no network grant these are the remaining targets.
  - --filesystem=home
  - --nofilesystem=home/.ssh
  - --nofilesystem=home/.gnupg
  - --nofilesystem=home/.pki
  - --nofilesystem=home/.config/autostart
  - --nofilesystem=home/.local/share/applications
  # Workspaces on removable media are out of reach by design; granting
  # --filesystem=/run/media would widen the sandbox for an uncommon case.

# WebKitGTK decodes media through GStreamer, and the runtime's own ffmpeg still
# omits avdec_h264, so the .mp4, .m4v and .mov files that kinds.rs accepts need
# org.freedesktop.Platform.codecs-extra. On the 24.08 base this app declared the
# equivalent (ffmpeg-full, now end-of-life) itself; from 25.08 the runtime
# declares the extension point and pulls it in as a related ref, so there is
# nothing to add here. Audio is unaffected either way: avdec_aac moved into the
# runtime, and .webm, .ogg, .opus, .mp3, .wav and .flac always came from it.

modules:
  - name: ic
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin
      env:
        HOME: /run/build/ic
        YARN_CACHE_FOLDER: /run/build/ic/.yarn-cache
        # Points yarn at the mirror from node-sources.json without writing a
        # .yarnrc into the copied source tree.
        YARN_YARN_OFFLINE_MIRROR: /run/build/ic/flatpak-node/yarn-mirror
        CARGO_HOME: /run/build/ic/cargo
        CARGO_NET_OFFLINE: "true"
    build-commands:
      # flatpak-cargo-generator still emits the deprecated $CARGO_HOME/config
      # name, which cargo warns about on every invocation.
      - test -f cargo/config && mv cargo/config cargo/config.toml || true
      - yarn install --offline --frozen-lockfile --non-interactive
      - yarn build
      # glib is a [patch.crates-io] path dependency carrying the fix for
      # RUSTSEC-2024-0429, so it is compiled from the tree rather than vendored.
      # Fail here, not three modules later, if it did not get copied in.
      - test -f src-tauri/third_party/glib-0.18.5/Cargo.toml
      - cargo build --locked --offline --release --manifest-path src-tauri/Cargo.toml --features custom-protocol --bin ic
      - install -Dm755 src-tauri/target/release/ic "$FLATPAK_DEST/bin/ic"
      - install -Dm644 flatpak/org.ic.canvas.desktop "$FLATPAK_DEST/share/applications/org.ic.canvas.desktop"
      - install -Dm644 flatpak/org.ic.canvas.metainfo.xml "$FLATPAK_DEST/share/metainfo/org.ic.canvas.metainfo.xml"
      - install -Dm644 src-tauri/icons/32x32.png "$FLATPAK_DEST/share/icons/hicolor/32x32/apps/org.ic.canvas.png"
      - install -Dm644 src-tauri/icons/128x128.png "$FLATPAK_DEST/share/icons/hicolor/128x128/apps/org.ic.canvas.png"
      - install -Dm644 src-tauri/icons/128x128@2x.png "$FLATPAK_DEST/share/icons/hicolor/256x256/apps/org.ic.canvas.png"
      - install -Dm644 src-tauri/icons/icon.png "$FLATPAK_DEST/share/icons/hicolor/512x512/apps/org.ic.canvas.png"
      # Catch broken metadata here rather than in a software centre.
      - desktop-file-validate "$FLATPAK_DEST/share/applications/org.ic.canvas.desktop"
      - appstreamcli validate --no-net "$FLATPAK_DEST/share/metainfo/org.ic.canvas.metainfo.xml"
    sources:
      - type: dir
        path: ..
        # skip entries are literal relative paths: flatpak-builder does not glob
        # them, so a pattern like `.pi*` would silently match nothing.
        skip:
          - .git
          - .github
          - .flatpak-builder
          - .pi-subagents
          - build-flatpak
          - dist
          - node_modules
          - public/pdfjs
          - src-tauri/target
      - cargo-sources.json
      - node-sources.json
