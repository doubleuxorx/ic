[package]
name = "ic"
version = "0.4.0"
description = "Offline-first infinite canvas knowledge application"
authors = ["ic contributors"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "ic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
notify = "8"
notify-debouncer-full = "0.6"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
] }
percent-encoding = "2"
sha2 = "0.10"
infer = "0.19"
urlencoding = "2"
tiny_http = { version = "0.12", default-features = false }
getrandom = "0.3"

[features]
# Selects the embedded frontend instead of a dev server. The Tauri CLI enables
# it for `tauri build`; do not remove.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
# Tauri's mock runtime, which builds the real application — commands, protocol
# handler and state — with no window and no display, so `cargo test` covers the
# privileged surface on a machine with no graphics stack at all.
tauri = { version = "2", features = ["test"] }

# glib 0.18.5 is unsound (RUSTSEC-2024-0429): VariantStrIter::impl_get passes a
# C out-argument as `&p` instead of `&mut p`, so optimizing builds of recent
# rustc discard the write and CStr::from_ptr then dereferences NULL. Upstream
# only fixed it in glib 0.20, which this tree cannot reach: gtk3-rs stopped at
# 0.18 and every WebKitGTK crate under Tauri pins glib 0.18. The vendored copy
# is the published crate plus that one-line fix; see third_party/README.md.
[patch.crates-io]
glib = { path = "third_party/glib-0.18.5" }

# The vendored crate is a patched dependency, not our code: keeping it out of
# the workspace means cargo fmt, clippy and test never descend into it.
[workspace]
exclude = ["third_party/glib-0.18.5"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
incremental = false
