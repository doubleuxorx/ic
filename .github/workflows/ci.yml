name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # WebKitGTK and its build dependencies are only needed on Linux.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Bundle PDF.js assets
        run: node scripts/prepare-assets.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npx vitest run

      - name: Frontend build
        run: npx vite build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Audit JavaScript dependencies
        run: yarn npm audit --severity moderate || yarn audit --level moderate

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  package:
    name: package (${{ matrix.os }})
    needs: check
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Bundle PDF.js assets
        run: node scripts/prepare-assets.mjs

      - name: Build installers
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ic-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: warn

  package-alpine-appimage:
    name: package (alpine-musl-x86_64 AppImage)
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ALPINE_IMAGE: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
      MUSL_CARGO_HOME: /home/runner/.cache/musl-cargo

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GitHub has no hosted Alpine runner. Build in a native x86_64 Alpine
      # container on the hosted Ubuntu runner instead. Installing the WebKitGTK
      # toolchain dominates this job, so the image layers are cached.
      - name: Build Alpine AppImage builder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/alpine-appimage.Dockerfile
          platforms: linux/amd64
          tags: ic-alpine-appimage-builder
          load: true
          cache-from: type=gha,scope=alpine-appimage
          cache-to: type=gha,mode=max,scope=alpine-appimage

      # Kept separate from the other jobs' caches: this is a musl target built
      # by Alpine's rustc, so none of it is interchangeable with their output.
      - name: Cache musl Rust build
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/musl-cargo
            src-tauri/target
          key: musl-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: musl-cargo-

      - name: Build musl x86_64 AppImage
        run: |
          mkdir -p "$MUSL_CARGO_HOME"
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$MUSL_CARGO_HOME:/cargo" \
            --env CARGO_HOME=/cargo \
            --workdir /workspace \
            ic-alpine-appimage-builder

      # The container runs as root, so everything it wrote is owned by root and
      # any later step that touches the workspace or the cache would fail.
      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$MUSL_CARGO_HOME"

      # A bare Alpine image with nothing but xvfb: no GTK, no WebKitGTK, none of
      # the builder's libraries. A bundle that is not self-contained, or whose
      # AppRun or WebKitGTK path rewriting silently did not apply, fails here
      # rather than on a user's machine.
      - name: Smoke test AppImage
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /tmp \
            "$ALPINE_IMAGE" \
            /bin/sh -c 'apk add --no-cache xvfb-run >/dev/null &&
              exec /workspace/scripts/smoke-test-appimage.sh \
                /workspace/src-tauri/target/release/bundle/appimage-musl/ic_*.AppImage'

      - uses: actions/upload-artifact@v4
        with:
          name: ic-alpine-musl-x86_64
          path: src-tauri/target/release/bundle/appimage-musl/*.AppImage
          if-no-files-found: error

  flatpak:
    name: package (Flatpak x86_64)
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ic.flatpak
          manifest-path: flatpak/org.ic.canvas.yml
          artifact-name: ic-flatpak-x86_64
          cache-key: flatpak-${{ hashFiles('flatpak/org.ic.canvas.yml', 'flatpak/*-sources.json', 'yarn.lock', 'src-tauri/Cargo.lock') }}
