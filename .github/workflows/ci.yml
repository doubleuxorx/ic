name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # WebKitGTK and its build dependencies are only needed on Linux.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Bundle PDF.js assets
        run: node scripts/prepare-assets.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npx vitest run

      - name: Frontend build
        run: npx vite build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Audit JavaScript dependencies
        run: yarn npm audit --severity moderate || yarn audit --level moderate

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  package:
    name: package (${{ matrix.os }})
    needs: check
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Bundle PDF.js assets
        run: node scripts/prepare-assets.mjs

      - name: Build installers
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ic-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: warn

  package-musl-appimage:
    name: package (musl-x86_64 AppImage)
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ALPINE_IMAGE: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
      MUSL_CARGO_HOME: /home/runner/.cache/musl-cargo

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GitHub has no hosted Alpine runner. Build in a native x86_64 Alpine
      # container on the hosted Ubuntu runner instead. Installing the WebKitGTK
      # toolchain dominates this job, so the image layers are cached.
      - name: Build Alpine AppImage builder
        uses: docker/build-push-action@v6
        env:
          # Otherwise every run leaves a *.dockerbuild build record next to the
          # artifacts anyone downloading a release build has to pick through.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: .github/alpine-appimage.Dockerfile
          platforms: linux/amd64
          tags: ic-alpine-appimage-builder
          load: true
          cache-from: type=gha,scope=alpine-appimage
          cache-to: type=gha,mode=max,scope=alpine-appimage

      # Kept separate from the other jobs' caches: this is a musl target built
      # by Alpine's rustc, so none of it is interchangeable with their output.
      - name: Cache musl Rust build
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/musl-cargo
            src-tauri/target
          key: musl-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: musl-cargo-

      - name: Build musl x86_64 AppImage
        run: |
          mkdir -p "$MUSL_CARGO_HOME"
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$MUSL_CARGO_HOME:/cargo" \
            --env CARGO_HOME=/cargo \
            --workdir /workspace \
            ic-alpine-appimage-builder

      # The container runs as root, so everything it wrote is owned by root and
      # any later step that touches the workspace or the cache would fail.
      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$MUSL_CARGO_HOME"

      # A bare Alpine image with nothing but xvfb: no GTK, no WebKitGTK, none of
      # the builder's libraries. A bundle that is not self-contained, or whose
      # AppRun or WebKitGTK path rewriting silently did not apply, fails here
      # rather than on a user's machine.
      - name: Smoke test AppImage
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /tmp \
            "$ALPINE_IMAGE" \
            /bin/sh -c 'apk add --no-cache xvfb-run >/dev/null &&
              exec /workspace/scripts/smoke-test-appimage.sh \
                /workspace/src-tauri/target/release/bundle/appimage-musl/ic_*.AppImage'

      - uses: actions/upload-artifact@v4
        with:
          name: ic-musl-x86_64
          path: src-tauri/target/release/bundle/appimage-musl/*.AppImage
          if-no-files-found: error

  # Runs on pull requests too: the generated source manifests are the only part
  # of the Flatpak build that goes stale silently, and the build itself is too
  # expensive to run per PR.
  flatpak-sources:
    name: flatpak sources in sync
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Regenerate source manifests
        run: sh flatpak/generate-sources.sh

      - name: Fail if they differ from the committed ones
        run: |
          if ! git diff --exit-code -- flatpak/node-sources.json flatpak/cargo-sources.json; then
            echo "::error::flatpak/*-sources.json no longer match the lockfiles;" \
              "run flatpak/generate-sources.sh and commit the result"
            exit 1
          fi

  flatpak:
    name: package (Flatpak x86_64)
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # A source-tree change invalidates the single module's cache stage, so most
    # runs rebuild all of the Rust dependency graph with lto and one codegen
    # unit. Budgeted like the Alpine AppImage job, which does the same work.
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak
        # v6, pinned like the Alpine builder image below.
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb
        with:
          bundle: ic.flatpak
          branch: stable
          manifest-path: flatpak/org.ic.canvas.yml
          cache-key: flatpak-${{ hashFiles('flatpak/org.ic.canvas.yml', 'flatpak/*-sources.json', 'yarn.lock', 'src-tauri/Cargo.lock') }}

      # The bundle is only ever installed from, so check it the way a user gets
      # it: every library resolvable against the plain runtime, the exported
      # files present, and no network permission smuggled into the metadata.
      - name: Smoke test bundle
        run: |
          flatpak install --user --noninteractive --no-related --bundle ic.flatpak
          flatpak run --user --command=sh org.ic.canvas -c '
            set -e
            test -x /app/bin/ic
            ! ldd /app/bin/ic | grep -q "not found"
            test -f /app/share/applications/org.ic.canvas.desktop
            test -f /app/share/metainfo/org.ic.canvas.metainfo.xml
          '
          flatpak info --show-metadata org.ic.canvas > metadata.txt
          grep -q '^\[Extension org.freedesktop.Platform.ffmpeg-full\]$' metadata.txt
          if grep '^shared=' metadata.txt | grep -q network; then
            echo "::error::the bundle grants network access"
            exit 1
          fi
